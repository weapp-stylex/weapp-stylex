name: Documentation checks

on:
  push:
    branches: [main]
    paths: ['apps/docs/**', scripts/test-docs-browser.mjs, scripts/build-docs.mjs, scripts/deploy-docs.mjs, scripts/docs-deployment/**, pnpm-lock.yaml, package.json, repoctl.config.ts, .github/workflows/docs.yml]
  pull_request:
    paths: ['apps/docs/**', scripts/test-docs-browser.mjs, scripts/build-docs.mjs, scripts/deploy-docs.mjs, scripts/docs-deployment/**, pnpm-lock.yaml, package.json, repoctl.config.ts, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, preview]
    env:
      REPO_DOCS_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:docs-deployment
      - name: Build public API declarations for documentation coverage
        run: pnpm --filter './packages/*' build
      - run: pnpm --filter docs lint
      - run: pnpm --filter docs typecheck
      - run: pnpm --filter docs build
      - run: pnpm --filter docs check:site
      - run: pnpm --filter docs test
      - name: Install the production documentation browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production documentation interactions
        run: pnpm exec node scripts/test-docs-browser.mjs
