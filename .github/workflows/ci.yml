name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24.22.2, 26.13.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Bootstrap Corepack for Node 26 and reproducible pnpm
        run: npm install --global corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Build libraries and documentation
        run: pnpm --filter './packages/*' --filter docs build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:docs-deployment
      - name: Verify build initialization, IDE application readiness and resource ownership
        run: pnpm exec node --test scripts/taro/*.test.mjs scripts/ide-*.test.mjs scripts/watcher-ready.test.mjs scripts/build-provenance.test.mjs scripts/library-packs.test.mjs
      - run: pnpm test:deps
      - name: Verify minimum supported weapp-vite and Wevu hosts
        run: pnpm exec node scripts/test-minimum-weapp-vite.mjs
      - name: Verify minimum hosts with safe SWC acceleration
        run: pnpm exec node scripts/test-minimum-weapp-vite.mjs
        env:
          WEAPP_STYLEX_BACKEND: auto
      - run: pnpm test:integration
      - name: Verify mixed backend module graphs and filesystem caches
        run: pnpm test:integration
        env:
          WEAPP_STYLEX_BACKEND: auto
      - run: pnpm exec repo deps check
      - run: pnpm exec repo doctor
      - run: pnpm exec repo check --full
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-node-${{ matrix.node }}
          path: |
            coverage/
            artifacts/benchmark.json
            artifacts/dependency-upgrade/
            artifacts/shared-style-growth-*.json
            artifacts/ide/report.json
            artifacts/h5/
            artifacts/consumer-install-*/
          if-no-files-found: ignore

  platforms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24.22.2, 26.13.0]
        target: [weapp, alipay, tt, h5]
    env:
      WEAPP_STYLEX_TARGET: ${{ matrix.target }}
      WEAPP_STYLEX_COMPARE_BACKENDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Bootstrap Corepack for Node 26 and reproducible pnpm
        run: npm install --global corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build StyleX packages
        run: pnpm --filter './packages/*' build
      - name: Install the headless H5 browser
        if: matrix.target == 'h5'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build target with official Babel
        run: pnpm exec node scripts/build-examples.mjs "$WEAPP_STYLEX_TARGET"
      - name: Verify target artifacts and capture the Babel CSS baseline
        run: pnpm test:examples
      - name: Verify H5 production and development interactions
        if: matrix.target == 'h5'
        run: pnpm test:h5
      - name: Build target with safe SWC acceleration
        run: pnpm exec node scripts/build-examples.mjs "$WEAPP_STYLEX_TARGET"
        env:
          WEAPP_STYLEX_BACKEND: auto
      - name: Verify target artifacts match official Babel
        run: pnpm test:examples
        env:
          WEAPP_STYLEX_BACKEND: auto
      - name: Verify H5 interactions with safe SWC acceleration
        if: matrix.target == 'h5'
        run: pnpm test:h5
        env:
          WEAPP_STYLEX_BACKEND: auto
      - name: Verify candidate tarballs in isolated framework consumers
        if: matrix.node == '26.13.0'
        run: corepack pnpm exec node scripts/test-consumer-hosts.mjs
      - name: Verify individual adapters in isolated framework consumers
        if: matrix.node == '26.13.0'
        run: corepack pnpm exec node scripts/test-consumer-hosts.mjs
        env:
          WEAPP_STYLEX_CONSUMER_ENTRY: adapter
      - name: Verify the previously supported DCloud channel with the facade
        if: matrix.node == '26.13.0' && (matrix.target == 'weapp' || matrix.target == 'h5')
        run: corepack pnpm exec node scripts/test-consumer-hosts.mjs
        env:
          WEAPP_STYLEX_UNI_HOST_VERSION: 3.0.0-alpha-5030120260930001
      - name: Verify the previously supported DCloud channel with its adapter
        if: matrix.node == '26.13.0' && (matrix.target == 'weapp' || matrix.target == 'h5')
        run: corepack pnpm exec node scripts/test-consumer-hosts.mjs
        env:
          WEAPP_STYLEX_UNI_HOST_VERSION: 3.0.0-alpha-5030120260930001
          WEAPP_STYLEX_CONSUMER_ENTRY: adapter
      - name: Retain platform diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.target }}-node-${{ matrix.node }}
          path: |
            artifacts/example-babel-css-*.json
            artifacts/h5/
            artifacts/build-provenance/
            artifacts/consumer-hosts-*/
            artifacts/consumer-install-*/
          if-no-files-found: ignore

  consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.1, 24.11.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - name: Bootstrap Corepack for Node 26 and reproducible pnpm
        run: npm install --global corepack@0.36.0 && corepack enable
      - name: Prepare tarballs with the supported workspace toolchain
        run: |
          pnpm install --frozen-lockfile
          corepack pnpm exec node scripts/library-packs.mjs artifacts/consumer-packs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Record the published consumer Node runtime
        id: consumer-node
        run: node --input-type=module -e 'import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_OUTPUT, "path=" + process.execPath + "\n")'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Verify isolated consumers on published Node floors
        run: node scripts/test-package.mjs
        env:
          WEAPP_STYLEX_TEST_PACKS_DIR: artifacts/consumer-packs
          WEAPP_STYLEX_TEST_NODE_PATH: ${{ steps.consumer-node.outputs.path }}
      - name: Retain consumer installation diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-install-node-${{ matrix.node }}
          path: artifacts/consumer-install-*/
          if-no-files-found: ignore

  host-candidate:
    name: Evaluate weapp-vite 7.8 Linux virtual inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Install the official candidate outside the workspace
        run: npm install --prefix "$RUNNER_TEMP/weapp-vite-7.8" --no-audit --no-fund weapp-vite@7.8.0
      - name: Verify public artifact builds with long physical source paths
        run: node scripts/test-weapp-vite-synthetic-ids.mjs --host-root "$RUNNER_TEMP/weapp-vite-7.8" --host-version 7.8.0 --policy require-success --output artifacts/dependency-upgrade/weapp-vite-7.8-linux
      - name: Retain candidate evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weapp-vite-7.8-linux-evaluation
          path: artifacts/dependency-upgrade/weapp-vite-7.8-linux/
          if-no-files-found: error
