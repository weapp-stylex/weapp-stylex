name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.3, 24.21.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Build libraries and documentation
        run: pnpm --filter './packages/*' --filter docs build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify build initialization, IDE application readiness and resource ownership
        run: pnpm exec node --test scripts/taro/*.test.mjs scripts/ide-*.test.mjs scripts/watcher-ready.test.mjs
      - run: pnpm test:deps
      - name: Verify minimum supported weapp-vite and Wevu hosts
        run: pnpm exec node scripts/test-minimum-weapp-vite.mjs
      - name: Verify minimum hosts with safe SWC acceleration
        run: pnpm exec node scripts/test-minimum-weapp-vite.mjs
        env:
          WEAPP_STYLEX_BACKEND: auto
      - run: pnpm test:integration
      - name: Verify mixed backend module graphs and filesystem caches
        run: pnpm test:integration
        env:
          WEAPP_STYLEX_BACKEND: auto
      - run: pnpm exec repo deps check
      - run: pnpm exec repo doctor
      - run: pnpm exec repo check --full
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-node-${{ matrix.node }}
          path: |
            coverage/
            artifacts/benchmark.json
            artifacts/ide/report.json
            artifacts/h5/
          if-no-files-found: ignore

  platforms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.3, 24.21.0]
        target: [weapp, alipay, tt, h5]
    env:
      WEAPP_STYLEX_TARGET: ${{ matrix.target }}
      WEAPP_STYLEX_COMPARE_BACKENDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build StyleX packages
        run: pnpm --filter './packages/*' build
      - name: Install the headless H5 browser
        if: matrix.target == 'h5'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build target with official Babel
        run: pnpm exec node scripts/build-examples.mjs "$WEAPP_STYLEX_TARGET"
      - name: Verify target artifacts and capture the Babel CSS baseline
        run: pnpm test:examples
      - name: Verify H5 production and development interactions
        if: matrix.target == 'h5'
        run: pnpm test:h5
      - name: Build target with safe SWC acceleration
        run: pnpm exec node scripts/build-examples.mjs "$WEAPP_STYLEX_TARGET"
        env:
          WEAPP_STYLEX_BACKEND: auto
      - name: Verify target artifacts match official Babel
        run: pnpm test:examples
        env:
          WEAPP_STYLEX_BACKEND: auto
      - name: Verify H5 interactions with safe SWC acceleration
        if: matrix.target == 'h5'
        run: pnpm test:h5
        env:
          WEAPP_STYLEX_BACKEND: auto
      - name: Retain platform diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.target }}-node-${{ matrix.node }}
          path: |
            artifacts/example-babel-css-*.json
            artifacts/h5/
          if-no-files-found: ignore

  consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.1, 24.11.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare tarballs with the supported workspace toolchain
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter './packages/*' build
          mkdir -p artifacts/consumer-packs
          for package in core compiler weapp-vite taro uni-app weapp-stylex; do
            pnpm -C "packages/$package" pack --pack-destination ../../artifacts/consumer-packs
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify isolated consumers on published Node floors
        run: node scripts/test-package.mjs
        env:
          WEAPP_STYLEX_TEST_PACKS_DIR: artifacts/consumer-packs
